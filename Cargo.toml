[package]
name = "bevy_plugin_graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Records which Bevy plugin added which plugin, and renders the result as JSON or Mermaid"
keywords = ["bevy", "gamedev", "plugin", "visualization"]
categories = ["game-development", "visualization"]

[dependencies]
# Deliberately not the `bevy` facade: this crate only ever touches `App` and the
# `World`, and Cargo unifies these with whatever `bevy` a downstream app uses.
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Only so the example reads like a real Bevy app (`use bevy::prelude::*`).
# No rendering: default features stay off.
bevy = { version = "0.19", default-features = false }
